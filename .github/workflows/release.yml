name: Release card

on:
  push:
    branches: [main]
    paths:
      - "multi-light-control-card.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^const CARD_VERSION = "\([^"]*\)";/\1/p' multi-light-control-card.js | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate JavaScript
        run: node --check multi-light-control-card.js
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Multi-Light Control Card v${{ steps.version.outputs.version }}
          files: multi-light-control-card.js
          generate_release_notes: true
          fail_on_unmatched_files: true
